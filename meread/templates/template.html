<!doctype html>
<html>

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<link rel="stylesheet" href="/~~~meread/styles.css" />

	{%if light%}
	<link rel="stylesheet" href="/~~~meread/styles-light.css" />
	{%endif%}

	<script src="/~~~meread/script.js"></script>
	<title>{{ title }}</title>
</head>

<body>
	{%if !breadcrumb.is_empty()%}
	<nav class="meread-breadcrumb">{{ breadcrumb | safe }}</nav>
	{%endif%}

	{{ contents | safe }}
</body>
<script>
	// only the page meread was started with is the one being pushed over the socket; any other
	// page has to reload itself instead of swallowing someone else's html
	const isIndex = {{ is_index }};
	new WebSocket('/~~~meread-reload').onmessage = (e) => {
		if (isIndex && e.data) {
			document.body.innerHTML = e.data
		} else {
			window.location.reload()
		}
	};
</script>

</html>
